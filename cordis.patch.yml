# dsh-ui-attention bundle patch: inserts the browser attention-alert plugin
# row into the web profile's client roster. Applied automatically once the
# package joins the profile's bundle list (dsh plugin --profile web add ...).
#
# WARNING: never add the same "ui-attention" insert row to the user profile
# patch (~/.dsh/profiles/web/cordis.patch.yml) too - insert rows are not
# deduplicated by id across layers and the loader refuses to boot with
# "duplicate loader entry id: ui-attention". Pick exactly one route.
- insert:
    - id: ui-attention
      name: "dsh-ui-attention"
